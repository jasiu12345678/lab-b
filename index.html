<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mateusz Rembas (55555) - AI LAB B</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>

<main class="main">

    <h1>to do list</h1>

    <label for="fsearch">Search:</label>
    <input type="search" id="fsearch" name="fsearch" placeholder="at least 2 characters">
    <ul class="list" aria-label="taski"></ul>

    <form id="add-task-form" novalidate>
        <label for="ftask">new task:</label>
        <input type="text" id="ftask" name="ftask">
        <label for="fdate">due:</label>
        <input type="datetime-local" id="fdate" name="fdate">
        <button type="submit">add</button>
        <span id="add-error" class="error" role="alert"></span>
    </form>

</main>

</body>
</html>
